<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#071014">
  <title>3Dee PRO – Offline</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #05090b;
      color: #e9fbff;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(circle at 20% 10%, rgba(36, 232, 255, 0.14), transparent 32rem),
        linear-gradient(180deg, #081116, #05090b);
    }

    main {
      width: min(100%, 560px);
      padding: 32px;
      border: 1px solid rgba(114, 216, 238, 0.25);
      border-radius: 22px;
      background: rgba(10, 22, 28, 0.94);
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.45);
      text-align: center;
    }

    img { width: 88px; height: 88px; }
    h1 { margin: 20px 0 10px; font-size: clamp(1.6rem, 7vw, 2.4rem); }
    p { margin: 8px 0; color: #9bb7be; line-height: 1.6; }

    button {
      margin-top: 22px;
      min-height: 46px;
      padding: 0 20px;
      border: 1px solid rgba(36, 232, 255, 0.5);
      border-radius: 12px;
      color: #071014;
      background: #24e8ff;
      font: inherit;
      font-weight: 800;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <main>
    <img src="./icons/icon-192.png" alt="3Dee PRO">
    <h1>Ste offline / You are offline</h1>
    <p>Rozhranie aplikácie môže fungovať z lokálnej pamäte, ale synchronizácia s Google cloudom potrebuje internet.</p>
    <p>The app interface can work from local storage, but Google cloud synchronization requires an internet connection.</p>
    <button type="button" onclick="location.reload()">Skúsiť znova / Try again</button>
  </main>
</body>
</html>
